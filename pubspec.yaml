name: posyandu_app
description: Aplikasi Posyandu - Sistem Informasi Kesehatan Balita
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1

  # State Management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.0
  fl_chart: ^1.2.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.5.1
  badges: ^3.1.2

  # Utils
  intl: ^0.20.3
  image_picker: ^1.0.4
  permission_handler: ^12.0.3
  url_launcher: ^6.2.1
  flutter_html: ^3.0.0-beta.2
  timeago: ^3.6.0
  path_provider: ^2.1.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/